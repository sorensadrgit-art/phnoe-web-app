# KineLab PT repository mypy configuration (mypy 2.4.1 in tools-venv, checking against the
# scientific .venv interpreter via --python-executable). Strictness matches the R2 quality
# receipt (mypy defaults) plus hygiene warnings that only report stale configuration.
[mypy]
python_version = 3.13
# First-party scope is the same as ruff.toml, checked in two invocations because the code runs on
# two interpreters: root *.py, tools/ and tests/ run on the scientific .venv (default files below);
# agent-harness/ is installed into tools-venv (click lives only there) and is checked with
#   mypy --python-executable dist/fullproject-20261028/tools-venv/Scripts/python.exe agent-harness
files = *.py, tools, tests
exclude = (?x)(^|/|\\)(\.venv|dist|viewer|docs|examples|build|[^/\\]+\.egg-info)(/|\\)
# Root modules and tests/ helpers import each other by bare name (unittest runs with
# PYTHONPATH=.;tests). tools/ is resolved only as the namespace package "tools" because tests
# import it as tools.<module>; mapping it twice would make mypy see each file under two names.
# The harness package root is agent-harness/.
mypy_path = .,tests,agent-harness
explicit_package_bases = True
namespace_packages = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

# Third-party modules installed in .venv that ship neither inline types nor a py.typed marker
# (mypy reports import-untyped). No stub packages exist on the fixed toolchain, so imports are
# typed as Any at these boundaries only.
[mypy-opensim.*]
ignore_missing_imports = True
[mypy-Pose2Sim.*]
ignore_missing_imports = True
[mypy-anytree.*]
ignore_missing_imports = True
[mypy-rtmlib.*]
ignore_missing_imports = True

# psutil is installed but its stubs live in the separate types-psutil distribution, which is not
# present in the fixed tools-venv (installs are not permitted). Remove once types-psutil is added.
[mypy-psutil.*]
ignore_missing_imports = True

# tools-venv setuptools has no inline types; stubs are the separate types-setuptools package,
# not installed on the fixed toolchain. Only agent-harness/setup.py imports it.
[mypy-setuptools.*]
ignore_missing_imports = True

# Blender's embedded Python modules; they exist only inside Blender, never in .venv.
[mypy-bpy.*]
ignore_missing_imports = True
[mypy-mathutils.*]
ignore_missing_imports = True
